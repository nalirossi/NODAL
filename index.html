              <line x1="50" y1="80" x2="${W - 50}" y2="80" stroke="${textColor}" stroke-width="1.5" opacity="0.8" />
              <line x1="50" y1="${H - 75}" x2="${W - 50}" y2="${H - 75}" stroke="${textColor}" stroke-width="1.5" opacity="0.8" />
            </g>` : ''}
            
            <g ${getWordTag('sonos')}>
              <text x="0" y="0" font-size="30" font-weight="700" letter-spacing="-0.03em">${escapeXml(wSonos.text)}</text>
            </g>
            <g ${getWordTag('festival')}>
              <text x="0" y="0" font-size="12" font-weight="700" text-anchor="end" letter-spacing="0.04em">${escapeXml(wFest.text)}</text>
            </g>
            
            <g ${getWordTag('dialogos')}>
              <text x="0" y="0" font-size="11" font-weight="600" letter-spacing="0.08em">${escapeXml(wDial.text)}</text>
            </g>
            <g ${getWordTag('vibracion')}>
              <text x="0" y="0" font-size="11" font-weight="700" letter-spacing="0.1em" fill="${cB || textColor}">${escapeXml(wVib.text)}</text>
            </g>
            <g ${getWordTag('precision')}>
              <text x="0" y="0" font-size="10" font-weight="600">${escapeXml(wPrec.text)}</text>
            </g>
            <g ${getWordTag('rigor')}>
              <text x="0" y="0" font-size="10" font-weight="700" text-anchor="end" letter-spacing="0.05em">${escapeXml(wRig.text)}</text>
            </g>
          </g>
        `;
      } else if (posterStyle === 'intervals') {
        layoutInner = `
          <g font-family="'Inter', sans-serif" fill="${textColor}">
            <g ${getWordTag('misc_symbol')}>
              <text x="0" y="0" font-size="36" font-weight="900">${escapeXml(wSym.text)}</text>
            </g>
            <g ${getWordTag('festival')}>
              <text x="0" y="0" font-size="19" font-weight="800">${escapeXml(wFest.text)}</text>
            </g>
            <g ${getWordTag('misc_badge')}>
              <text x="0" y="0" font-size="16" font-weight="800" text-anchor="end">${escapeXml(wBdg.text)}</text>
            </g>
            
            <g ${getWordTag('dialogos')}>
              <text x="0" y="0" font-size="17" font-weight="800">${escapeXml(wDial.text)}</text>
            </g>
            <g ${getWordTag('vibracion')}>
              <text x="0" y="0" font-size="18" font-weight="900">${escapeXml(wVib.text)}</text>
            </g>
            <g ${getWordTag('precision')}>
              <text x="0" y="0" font-size="17" font-weight="800">${escapeXml(wPrec.text)}</text>
            </g>
            <g ${getWordTag('rigor')}>
              <text x="0" y="0" font-size="17" font-weight="800">${escapeXml(wRig.text)}</text>
            </g>

            <g ${getWordTag('sonos')}>
              <text x="0" y="0" font-size="118" font-weight="900" letter-spacing="-0.04em">${escapeXml(wSonos.text)}</text>
            </g>
          </g>
        `;
      } else if (posterStyle === 'poster_target') {
        layoutInner = `
          <g font-family="'Space Grotesk', sans-serif" fill="${textColor}">
            <g ${getWordTag('misc_symbol')}>
              <circle cx="0" cy="0" r="3.5" fill="${textColor}" />
            </g>
            <g ${getWordTag('misc_badge')}>
              <text x="0" y="0" font-size="10" font-weight="700" letter-spacing="0.1em">${escapeXml(wBdg.text)}</text>
            </g>
            
            <g ${getWordTag('sonos')}>
              <text x="0" y="0" font-size="42" font-weight="800">${escapeXml(wSonos.text)}</text>
            </g>
            <g ${getWordTag('festival')}>
              <text x="0" y="0" font-size="15" font-weight="700" letter-spacing="0.04em">${escapeXml(wFest.text)}</text>
            </g>
            <g ${getWordTag('dialogos')}>
              <text x="0" y="0" font-size="14" font-weight="600" opacity="0.85">${escapeXml(wDial.text)}</text>
            </g>
            <g ${getWordTag('vibracion')}>
              <text x="0" y="0" font-size="16" font-weight="800" fill="${cA || textColor}">${escapeXml(wVib.text)}</text>
            </g>
            <g ${getWordTag('precision')}>
              <text x="0" y="0" font-size="12" font-weight="600" opacity="0.8">${escapeXml(wPrec.text)}</text>
            </g>
            <g ${getWordTag('rigor')}>
              <text x="0" y="0" font-size="11" font-weight="700" letter-spacing="0.06em">${escapeXml(wRig.text)}</text>
            </g>
          </g>
        `;
      } else if (posterStyle === 'poster_capsules') {
        layoutInner = `
          <g font-family="'Inter', sans-serif" fill="${textColor}">
            ${wLin.visible ? `
            <g ${getWordTag('misc_lines')}>
              <rect x="35" y="35" width="${W - 70}" height="${H - 70}" fill="none" stroke="${textColor}" stroke-width="1.5" opacity="0.6" />
            </g>` : ''}
            
            <g ${getWordTag('festival')}>
              <text x="0" y="0" font-size="14" font-weight="700" letter-spacing="0.04em">${escapeXml(wFest.text)}</text>
            </g>
            <g ${getWordTag('dialogos')}>
              <text x="0" y="0" font-size="14" font-weight="700" text-anchor="end">${escapeXml(wDial.text)}</text>
            </g>
            
            <g ${getWordTag('sonos')}>
              <rect x="-10" y="-32" width="280" height="46" rx="23" fill="#0a0a0a" />
              <text x="18" y="2" font-size="24" font-weight="900" fill="#ffffff">${escapeXml(wSonos.text)}</text>
            </g>

            <g ${getWordTag('vibracion')}>
              <rect x="-8" y="-26" width="210" height="38" rx="19" fill="${cA || '#ff0055'}" />
              <text x="14" y="2" font-size="16" font-weight="900" fill="#ffffff">${escapeXml(wVib.text)}</text>
            </g>

            <g ${getWordTag('precision')}>
              <rect x="-6" y="-20" width="240" height="32" rx="16" fill="${cB || '#00e5ff'}" />
              <text x="14" y="3" font-size="13" font-weight="800" fill="#000000">${escapeXml(wPrec.text)}</text>
            </g>
            
            <g ${getWordTag('rigor')}>
              <text x="0" y="0" font-size="13" font-weight="800" letter-spacing="0.05em">${escapeXml(wRig.text)}</text>
            </g>
          </g>
        `;
      } else if (posterStyle === 'deconstructed') {
        layoutInner = `
          <g font-family="'IBM Plex Mono', monospace" fill="${textColor}" font-size="16" font-weight="700" letter-spacing="0.28em">
            <g ${getWordTag('sonos')}>
              <text x="0" y="0">${escapeXml(wSonos.text)}</text>
            </g>
            <g ${getWordTag('festival')}>
              <text x="0" y="0">${escapeXml(wFest.text)}</text>
            </g>
            <g ${getWordTag('dialogos')}>
              <text x="0" y="0" opacity="0.75">${escapeXml(wDial.text)}</text>
            </g>
            <g ${getWordTag('vibracion')}>
              <text x="0" y="0" font-size="20" fill="${cA || '#ff3b00'}">${escapeXml(wVib.text)}</text>
            </g>
            <g ${getWordTag('precision')}>
              <text x="0" y="0">${escapeXml(wPrec.text)}</text>
            </g>
            <g ${getWordTag('rigor')}>
              <text x="0" y="0">${escapeXml(wRig.text)}</text>
            </g>
          </g>
        `;
      }

      posterOverlay = `
        <g id="editorialPoster" style="user-select: none;">
          ${layoutInner}
        </g>
      `;
    }
// Clip path para garantizar que el arte jamás desborde la mesa de trabajo (0 0 W H)
    defs = `<clipPath id="artboardClip">
        <rect x="0" y="0" width="${W}" height="${H}" />
      </clipPath>` + defs;

    const svgOut = `
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="overflow: hidden; background-color: ${isTrans ? 'transparent' : cBg};">
        <defs>${defs}</defs>
        <g id="artboardRoot" clip-path="url(#artboardClip)" style="isolation: isolate;">
          ${!isTrans ? `<rect id="artboardBg" x="0" y="0" width="${W}" height="${H}" fill="${cBg}" />` : ''}
          ${finalWaveLayer}
          <g id="generativeLayer" style="${blendStyle}">
             ${blurredForeground}
             ${finalCrispGroup}
          </g>
          ${gridOverlay}
          ${posterOverlay}
        </g>
      </svg>
    `;

    document.getElementById('svgHost').innerHTML = svgOut;
    } catch(renderErr) {
      console.error('Error in render():', renderErr);
      const host = document.getElementById('svgHost');
      if (host) {
        host.innerHTML = '<div style="color:#ff5252; padding:30px; font-family:IBM Plex Mono, monospace; text-align:center;"><div style="font-size:18px; font-weight:bold; margin-bottom:10px;">ERROR EN EL MOTOR GENERATIVO</div><div style="font-size:12px; opacity:0.85; margin-bottom:16px;">' + renderErr.message + '</div><button onclick="applyStudioPreset(\'sonos_targets\')" style="background:#222; color:#fff; border:1px solid #444; padding:8px 16px; border-radius:4px; cursor:pointer;">Restablecer a Preset Seguro</button></div>';
      }
    }
  }

  function getSvgBlob() {
    const svgEl = document.querySelector('#svgHost svg');
    const serializer = new XMLSerializer();
    let source = serializer.serializeToString(svgEl);
    if(!source.match(/^<svg[^>]+xmlns="http\:\/\/www\.w3\.org\/2000\/svg"/)){
        source = source.replace(/^<svg/, '<svg xmlns="http://www.w3.org/2000/svg"');
    }
    source = '<?xml version="1.0" standalone="no"?>\n' + source;
    return new Blob([source], {type:"image/svg+xml;charset=utf-8"});
  }

  function getSafeSvgBlobForRaster() {
    const svgEl = document.querySelector('#svgHost svg');
    const serializer = new XMLSerializer();
    let source = serializer.serializeToString(svgEl);
    if(!source.match(/^<svg[^>]+xmlns="http\:\/\/www\.w3\.org\/2000\/svg"/)){
        source = source.replace(/^<svg/, '<svg xmlns="http://www.w3.org/2000/svg"');
    }
    source = source.replace(/<style>@import\s+url\([^)]+\);?<\/style>/gi, '');
    source = '<?xml version="1.0" standalone="no"?>\n' + source;
    return new Blob([source], {type:"image/svg+xml;charset=utf-8"});
  }

  // Función maestra de rasterización: fidelidad 1:1 con la pantalla
  function exportRasterImage(mimeType, quality, ext) {
    const btn = ext === 'png' ? document.getElementById('btnPng') : document.getElementById('btnJpg');
    const originalText = btn.innerText;
    btn.innerText = 'EXPORTANDO...';
    btn.style.pointerEvents = 'none';
    
    const res = parseInt(document.getElementById('exportRes').value);
    const isTrans = document.getElementById('paramTrans').checked;
    const cBg = document.getElementById('colBg').value;
    
    // Obtenemos el SVG completo con su fondo, clipPath y capas idénticas a pantalla
    const svgBlob = getSvgBlob();
    const url = URL.createObjectURL(svgBlob);
    const img = new Image();
    
    const cleanup = () => {
      btn.innerText = originalText;
      btn.style.pointerEvents = 'auto';
      URL.revokeObjectURL(url);
    };

    img.onerror = () => {
      cleanup();
      alert('Aviso: Si tu navegador bloquea la rasterización de filtros complejos, descarga la versión SVG vectorial directa para fidelidad absoluta.');
    };
    
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = res;
      canvas.height = res;
      const ctx = canvas.getContext('2d');
      
      // En JPG o cuando no es transparente, dibujar el fondo base primero
      if (!isTrans || ext === 'jpg') {
        ctx.fillStyle = cBg;
        ctx.fillRect(0, 0, res, res);
      }
      
      // Dibujar SVG con el tamaño exacto del lienzo
      ctx.drawImage(img, 0, 0, res, res);
      URL.revokeObjectURL(url);
      
      canvas.toBlob(blob => {
        if (!blob) { cleanup(); return; }
        const durl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = durl;
        a.download = `nodal-render-${Date.now()}.${ext}`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(durl);
        cleanup();
      }, mimeType, quality);
    };
    img.src = url;
  }

  document.getElementById('btnSvg').addEventListener('click', () => {
    const url = URL.createObjectURL(getSvgBlob());
    const a = document.createElement('a');
    a.href = url;
    a.download = `nodal-vector-${Date.now()}.svg`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  document.getElementById('btnPng').addEventListener('click', () => {
    exportRasterImage('image/png', 1.0, 'png');
  });

  document.getElementById('btnJpg').addEventListener('click', () => {
    exportRasterImage('image/jpeg', 0.95, 'jpg');
  });

  // ========================================================
  // Sistema de interacción, edición y arrastre independiente
  // ========================================================
  function syncWordSlidersToSelected() {
    const key = document.getElementById('selectedWordToMove').value;
    const w = state.words[key] || { text: '', x: 0, y: 0, scale: 1.0, visible: true };
    
    document.getElementById('phraseTextInput').value = w.text || '';
    document.getElementById('wordPosX').value = w.x;
    document.getElementById('valWordX').innerText = w.x;
    document.getElementById('wordPosY').value = w.y;
    document.getElementById('valWordY').innerText = w.y;
    document.getElementById('wordScale').value = w.scale || 1.0;
    document.getElementById('valWordScale').innerText = (w.scale || 1.0).toFixed(2);

    const btnVis = document.getElementById('btnToggleWordVis');
    if (w.visible) {
      btnVis.style.background = '#d32f2f';
      btnVis.innerText = 'BORRAR';
      btnVis.title = 'Borrar u ocultar este elemento del afiche';
    } else {
      btnVis.style.background = '#388e3c';
      btnVis.innerText = 'RESTAURAR';
      btnVis.title = 'Volver a mostrar este elemento en el afiche';
    }
  }

  document.getElementById('selectedWordToMove').addEventListener('change', syncWordSlidersToSelected);

  // Edición directa del texto de cada frase
  let wordTextDebounce;
  document.getElementById('phraseTextInput').addEventListener('input', e => {
    const key = document.getElementById('selectedWordToMove').value;
    if (state.words[key]) {
      state.words[key].text = e.target.value;
      renderDebounced();
      clearTimeout(wordTextDebounce);
      wordTextDebounce = setTimeout(recordHistory, 500);
    }
  });

  // Borrar / Ocultar o Restaurar frase individual
  document.getElementById('btnToggleWordVis').addEventListener('click', () => {
    const key = document.getElementById('selectedWordToMove').value;
    if (state.words[key]) {
      state.words[key].visible = !state.words[key].visible;
      syncWordSlidersToSelected();
      render();
      recordHistory();
    }
  });

  // Restaurar todas las frases borradas
  document.getElementById('btnRestoreAllWords').addEventListener('click', () => {
    Object.keys(state.words).forEach(k => {
      state.words[k].visible = true;
    });
    syncWordSlidersToSelected();
    render();
    recordHistory();
  });

  document.getElementById('wordPosX').addEventListener('input', e => {
    const key = document.getElementById('selectedWordToMove').value;
    const val = parseInt(e.target.value);
    document.getElementById('valWordX').innerText = val;
    if (state.words[key]) {
      state.words[key].x = val;
      updateWordTransformDOM(key);
    }
  });
  document.getElementById('wordPosX').addEventListener('change', recordHistory);

  document.getElementById('wordPosY').addEventListener('input', e => {
    const key = document.getElementById('selectedWordToMove').value;
    const val = parseInt(e.target.value);
    document.getElementById('valWordY').innerText = val;
    if (state.words[key]) {
      state.words[key].y = val;
      updateWordTransformDOM(key);
    }
  });
  document.getElementById('wordPosY').addEventListener('change', recordHistory);

  document.getElementById('wordScale').addEventListener('input', e => {
    const key = document.getElementById('selectedWordToMove').value;
    const sc = parseFloat(e.target.value);
    document.getElementById('valWordScale').innerText = sc.toFixed(2);
    if (state.words[key]) {
      state.words[key].scale = sc;
      updateWordTransformDOM(key);
    }
  });
  document.getElementById('wordScale').addEventListener('change', recordHistory);

  function updateWordTransformDOM(key) {
    const wordEl = document.querySelector(`[data-word-id="${key}"]`);
    if (wordEl && state.words[key]) {
      wordEl.setAttribute('transform', `translate(${state.words[key].x}, ${state.words[key].y}) scale(${state.words[key].scale})`);
    }
  }

  document.getElementById('btnResetWordPos').addEventListener('click', () => {
    const style = document.getElementById('posterLayoutStyle').value;
    if (defaultWordLayouts[style]) {
      // Restablecer posiciones y escalas conservando textos editados
      Object.keys(defaultWordLayouts[style]).forEach(k => {
        if (!state.words[k]) state.words[k] = {};
        state.words[k].x = defaultWordLayouts[style][k].x;
        state.words[k].y = defaultWordLayouts[style][k].y;
        state.words[k].scale = defaultWordLayouts[style][k].scale;
      });
    }
    syncWordSlidersToSelected();
    render();
    recordHistory();
  });

  function setupPosterDraggable() {
    const svgHost = document.getElementById('svgHost');
    let isDragging = false;
    let activeKey = null;
    let startMouseX = 0, startMouseY = 0;
    let initialX = 0, initialY = 0;

    const getWordTarget = (el) => {
      while (el && el !== svgHost) {
        if (el.getAttribute && el.getAttribute('data-word-id')) return el.getAttribute('data-word-id');
        if (el.dataset && el.dataset.wordId) return el.dataset.wordId;
        el = el.parentElement || el.parentNode;
      }
      return null;
    };

    const startDrag = (clientX, clientY, target) => {
      const wordId = getWordTarget(target);
      if (!wordId) return false;
      
      isDragging = true;
      activeKey = wordId;
      if (!state.words[activeKey]) return false;

      document.getElementById('selectedWordToMove').value = activeKey;
      syncWordSlidersToSelected();

      startMouseX = clientX;
      startMouseY = clientY;
      initialX = state.words[activeKey].x;
      initialY = state.words[activeKey].y;

      const wordEl = svgHost.querySelector(`[data-word-id="${activeKey}"]`);
      if (wordEl) wordEl.classList.add('dragging');
      return true;
    };

    const moveDrag = (clientX, clientY) => {
      if (!isDragging || !activeKey || !state.words[activeKey]) return;
      const svg = svgHost.querySelector('svg');
      if (!svg) return;
      const rect = svg.getBoundingClientRect();
      const scaleRatio = state.W / rect.width;
      const dx = (clientX - startMouseX) * scaleRatio;
      const dy = (clientY - startMouseY) * scaleRatio;

      let newX = Math.round(initialX + dx);
      let newY = Math.round(initialY + dy);
      newX = Math.max(-250, Math.min(1250, newX));
      newY = Math.max(-250, Math.min(1250, newY));

      state.words[activeKey].x = newX;
      state.words[activeKey].y = newY;
      document.getElementById('wordPosX').value = newX;
      document.getElementById('valWordX').innerText = newX;
      document.getElementById('wordPosY').value = newY;
      document.getElementById('valWordY').innerText = newY;

      updateWordTransformDOM(activeKey);
    };

    const endDrag = () => {
      if (isDragging) {
        isDragging = false;
        if (activeKey) {
          const wordEl = svgHost.querySelector(`[data-word-id="${activeKey}"]`);
          if (wordEl) wordEl.classList.remove('dragging');
        }
        activeKey = null;
        renderDebounced();
        recordHistory();
      }
    };

    svgHost.addEventListener('mousedown', e => {
      if (startDrag(e.clientX, e.clientY, e.target)) e.preventDefault();
    });
    window.addEventListener('mousemove', e => moveDrag(e.clientX, e.clientY));
    window.addEventListener('mouseup', endDrag);

    svgHost.addEventListener('touchstart', e => {
      if (e.touches.length === 1) {
        if (startDrag(e.touches[0].clientX, e.touches[0].clientY, e.target)) e.preventDefault();
      }
    }, { passive: false });
    window.addEventListener('touchmove', e => {
      if (isDragging && e.touches.length === 1) {
        moveDrag(e.touches[0].clientX, e.touches[0].clientY);
        e.preventDefault();
      }
    }, { passive: false });
    window.addEventListener('touchend', endDrag);
  }
  // Event listeners for editorial layout
  ['posterLayoutEnabled', 'posterLayoutStyle'].forEach(id => {
    const el = document.getElementById(id);
    if (el) {
      el.addEventListener('change', () => {
        const style = document.getElementById('posterLayoutStyle').value;
        if (defaultWordLayouts[style]) {
          state.words = JSON.parse(JSON.stringify(defaultWordLayouts[style]));
          syncWordSlidersToSelected();
        }
        render();
        recordHistory();
      });
    }
  });

  loadSavedCustomPresets();
  updateControlsState();
  setupPosterDraggable();
  
  // INICIO IMPACTANTE: Inicia automáticamente con el preset estético 'sonos_targets'
  applyStudioPreset('sonos_targets');
  recordHistory();
</script>
